    <linearGradient id="shieldInset" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#1e5d9c" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#0f2249" stop-opacity="0.18"/>
