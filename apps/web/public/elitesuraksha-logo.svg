<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 540" role="img" aria-labelledby="title desc">
  <title id="title">EliteSuraksha 2.0 logo</title>
  <desc id="desc">Shield logo with infinity loop and network nodes for EliteSuraksha 2.0</desc>
  <defs>
    <linearGradient id="shieldFront" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2a5d"/>
      <stop offset="25%" stop-color="#0f355e"/>
      <stop offset="60%" stop-color="#0f2d5d"/>
      <stop offset="100%" stop-color="#0d2349"/>
